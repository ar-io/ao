version: '3.8'

services:
  server:
    build: .
    restart: always
    ports:
      - "6363:6363"
    volumes:
      - ./db:/usr/app/db
      - ./file-checkpoints:/usr/app/file-checkpoints
      - ./.env:/usr/app/.env
      - ./largest_nonces.db:/usr/app/largest_nonces.db
      - ./kinesis_largest_nonces.db:/usr/app/kinesis_largest_nonces.db
    command: ["/usr/app/restart_server.sh"]
    healthcheck:
      test: ["CMD", "/usr/app/collect_process_data.sh"]
      interval: 60s
      timeout: 59s
      retries: 0
      start_period: 60s

  checkpointer:
    build: ./src/checkpointer
    restart: always
    pid: "service:server"
    depends_on:
      - server
    volumes:
      - ./checkpointer-data:/data
      - ./db:/usr/app/db:ro
    environment:
      - PROCESS_ID=${PROCESS_ID:-qNvAoz0TgcH7DMg8BCVn8jF32QH5L6T29VjHxhHqqGE}
      - NONCE_THRESHOLD=${NONCE_THRESHOLD:-1000}
      - GRAPHQL_URL=${GRAPHQL_URL:-https://arweave-search.goldsky.com/graphql}
      - DB_PATH=/data/checkpoints.sqlite
      - BUNDLER_URL=${BUNDLER_URL:-https://upload.ardrive.io}
      - POLL_INTERVAL_MS=${POLL_INTERVAL_MS:-60000}
      - DRY_RUN=${DRY_RUN:-true}
    profiles:
      - checkpointing
